    <!--
      Theme is resolved before first paint so the app never flashes the wrong
      surface colour. Inline on purpose: a render-blocking request here would
      cost more than the 8 lines it saves.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('atlas.theme');
          var theme =
            stored ||
            (window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark');
          document.documentElement.dataset.theme = theme;
          document
            .querySelector('meta[name=theme-color]')
            .setAttribute('content', theme === 'light' ? '#f7f8fa' : '#08090c');
        } catch (e) {
          /* private mode — the dark default already applied is fine */
        }
      })();
    </script>
